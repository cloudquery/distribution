name: e2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  run-e2e-test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      -
        name: Build image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          targets: image-local
      -
        name: Start distribution server
        run: |
          docker run --rm -p 5000:5000 -p 5001:5001 -idt "registry:local"
      -
        name: Tests
        run: |
          bash ./tests/push.sh 127.0.0.0

  run-e2e-test-s3-storage:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      -
        name: Start E2E environment
        run: |
          make start-e2e-s3-env

      - name: Tests
        run: |
          bash ./tests/push.sh 127.0.0.0
          make stop-e2e-s3-env
